name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SHKTN-GAMING-SHOW main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SHKTN-GAMING-SHOW
          path: dist/SHKTN-GAMING-SHOW.exe
